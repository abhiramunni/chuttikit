<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChuttiKit — Plan Your 2027 Leave Like a Pro</title>
<meta name="description" content="Every 2027 Indian holiday, the long weekends hiding inside them, and a leave planner that turns 18 days off into a year of trips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f0e1; --paper2:#efe3cb; --card:#fffaf0; --ink:#2b1d12; --ink2:#6b5a48;
  --line:#e3d4b6; --bronze:#b4762a; --gold:#d9a441; --terra:#c05b2e; --rust:#9c3d1e;
  --cream:#fbf6ea; --soft:#f3ead6; --ok:#4a6b3a; --shadow:0 18px 44px rgba(43,29,18,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:var(--terra)}
::selection{background:var(--gold);color:var(--ink)}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#241708;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f7f0e1;transition:opacity .7s ease,visibility .7s}
#intro.gone{opacity:0;visibility:hidden}
#intro .mark{width:92px;height:92px;border-radius:26px;background:linear-gradient(140deg,#d9a441,#c05b2e);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(217,164,65,.4),0 24px 60px rgba(0,0,0,.5);animation:markIn 1s cubic-bezier(.2,.9,.3,1.2) both}
#intro .mark svg{width:52px;height:52px}
@keyframes markIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#intro h1{font-size:clamp(40px,8vw,64px);font-weight:800;margin-top:22px;letter-spacing:-.5px;animation:rise .8s .25s both}
#intro .tag{font-size:17px;color:#e8c98a;margin-top:6px;animation:rise .8s .45s both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(247,240,225,.2);border-radius:99px;margin-top:34px;overflow:hidden;animation:rise .8s .6s both}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a441,#e8c98a);border-radius:99px;animation:fill 2.6s .6s ease forwards}
@keyframes fill{to{width:100%}}
#introSkip{position:absolute;bottom:26px;right:26px;background:rgba(247,240,225,.12);color:#f7f0e1;border:1px solid rgba(247,240,225,.35);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(247,240,225,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
