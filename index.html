<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChuttiKit — Plan Your 2027 Leave Like a Pro</title>
<meta name="description" content="Every 2027 Indian holiday, the long weekends hiding inside them, and a leave planner that turns 18 days off into a year of trips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f0e1; --paper2:#efe3cb; --card:#fffaf0; --ink:#2b1d12; --ink2:#6b5a48;
  --line:#e3d4b6; --bronze:#b4762a; --gold:#d9a441; --terra:#c05b2e; --rust:#9c3d1e;
  --cream:#fbf6ea; --soft:#f3ead6; --ok:#4a6b3a; --shadow:0 18px 44px rgba(43,29,18,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:var(--terra)}
::selection{background:var(--gold);color:var(--ink)}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#241708;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f7f0e1;transition:opacity .7s ease,visibility .7s}
#intro.gone{opacity:0;visibility:hidden}
#intro .mark{width:92px;height:92px;border-radius:26px;background:linear-gradient(140deg,#d9a441,#c05b2e);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(217,164,65,.4),0 24px 60px rgba(0,0,0,.5);animation:markIn 1s cubic-bezier(.2,.9,.3,1.2) both}
#intro .mark svg{width:52px;height:52px}
@keyframes markIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#intro h1{font-size:clamp(40px,8vw,64px);font-weight:800;margin-top:22px;letter-spacing:-.5px;animation:rise .8s .25s both}
#intro .tag{font-size:17px;color:#e8c98a;margin-top:6px;animation:rise .8s .45s both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
#intro .bar{width:min(280px,70vw);height:4px;background:rgba(247,240,225,.2);border-radius:99px;margin-top:34px;overflow:hidden;animation:rise .8s .6s both}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a441,#e8c98a);border-radius:99px;animation:fill 2.6s .6s ease forwards}
@keyframes fill{to{width:100%}}
#introSkip{position:absolute;bottom:26px;right:26px;background:rgba(247,240,225,.12);color:#f7f0e1;border:1px solid rgba(247,240,225,.35);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(247,240,225,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none}
.logo .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#d9a441,#c05b2e);display:flex;align-items:center;justify-content:center;flex:none}
.logo .lg svg{width:22px;height:22px}
header.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
header.top nav a{color:var(--ink2);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:99px}
header.top nav a:hover{background:var(--soft);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden}
.hero .ph{position:relative;height:min(460px,62vw);overflow:hidden}
.hero .ph img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-14px)}}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,23,8,.05),rgba(36,23,8,.55))}
.hero .cap{position:absolute;left:0;right:0;bottom:0;max-width:1120px;margin:0 auto;padding:0 20px 34px;color:#fdf8ec}
.hero .kicker{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#f0cd8a}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.04;font-weight:800;max-width:640px;margin-top:8px;text-shadow:0 2px 22px rgba(0,0,0,.35)}
.hero .sub{font-size:17px;max-width:560px;margin-top:10px;color:#f3ead6;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.countcard{max-width:1120px;margin:-34px auto 0;padding:0 20px;position:relative;z-index:5}
.countcard .box{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.countcard .big{font-family:Fraunces,serif;font-size:clamp(26px,4vw,36px);font-weight:800;line-height:1.1}
.countcard .big small{display:block;font-family:Inter,sans-serif;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.countcard .nums{display:flex;gap:10px;margin-left:auto}
.countcard .nums div{background:var(--soft);border:1px solid var(--line);border-radius:14px;min-width:74px;padding:10px 8px;text-align:center}
.countcard .nums b{display:block;font-family:Fraunces,serif;font-size:28px;line-height:1}
.countcard .nums span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:44px 0 8px}
.sec-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:clamp(26px,4vw,34px);font-weight:800;line-height:1.1}
.sec-head .no{font-family:Fraunces,serif;font-size:15px;font-weight:700;color:var(--terra);letter-spacing:.14em}
.sec-head p{color:var(--ink2);max-width:640px;margin-top:6px}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{font-family:Fraunces,serif;font-size:30px;display:block;line-height:1}
.stat span{font-size:13px;color:var(--ink2);font-weight:600}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--terra);font-weight:700;margin-top:2px}
/* ---------- year strip ---------- */
.yearstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:20px}
.ymini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}
.ymini:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--bronze)}
.ymini.sel{border-color:var(--terra);box-shadow:0 0 0 2px rgba(192,91,46,.25)}
.ymini b{font-family:Fraunces,serif;font-size:17px;display:block}
.ymini span{font-size:12px;color:var(--ink2);font-weight:600}
.ymini .dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;min-height:8px}
.ymini .dots i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.ymini .dots i.g{background:var(--bronze)} .ymini .dots i.k{background:var(--terra)} .ymini .dots i.r{background:#c9a35c}
/* ---------- month grid ---------- */
.monthbox{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-top:18px;padding:22px}
.monthnav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.monthnav h3{font-size:24px;font-weight:800;flex:1;text-align:center}
.monthnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:18px;color:var(--ink);flex:none}
.monthnav button:hover{background:var(--paper2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:6px 0}
.cal .day{min-height:74px;border:1px solid var(--line);border-radius:12px;padding:7px 8px;background:var(--cream);cursor:pointer;text-align:left;position:relative;transition:border-color .15s,box-shadow .15s}
.cal .day:hover{border-color:var(--bronze);box-shadow:0 4px 14px rgba(43,29,18,.12)}
.cal .day .n{font-weight:700;font-size:14px}
.cal .day.we{background:var(--soft)}
.cal .day.today{border-color:var(--terra);box-shadow:0 0 0 2px rgba(192,91,46,.25)}
.cal .day.plan{border-color:var(--ok);box-shadow:0 0 0 2px rgba(74,107,58,.25)}
.cal .day .hn{font-size:11px;line-height:1.25;font-weight:600;color:var(--rust);margin-top:3px}
.cal .day .hn.r{color:#8a6d2f}.cal .day .hn.k{color:var(--terra)}
.cal .day .lv{position:absolute;top:6px;right:6px;background:var(--ok);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;letter-spacing:.04em}
.cal .day.empty{background:transparent;border-color:transparent;cursor:default}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* ---------- bridge cards ---------- */
.bridgegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.bridge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
